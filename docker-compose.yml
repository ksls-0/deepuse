# ============================================================
# 角色工坊 —— Docker Compose 一键部署
#
#   1. 本机打包：.\build.ps1                （产出单体 jar）
#   2. 上传到服务器（jar + 本文件 + Dockerfile + .dockerignore + deploy/docker/ + .env）
#   3. 服务器上：docker compose up -d --build
#
# 对外只暴露 80/443（由 nginx 容器接），app/mysql/redis 全部只在容器内网，
# 外网扫不到 8081 / 3306 / 6379 —— 不用再折腾防火墙规则。
#
# 所有可变项都在仓库根目录的 .env 里（见 .env.example），不要写死在这里。
# ============================================================
name: deepusecode

services:
  # ---------------- MySQL 8 ----------------
  mysql:
    image: mysql:8.0
    container_name: deepusecode-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: testlogin
      MYSQL_USER: deepusecode
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 是给 compose 的转义：容器里才会展开成 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  # ---------------- Redis 7 ----------------
  redis:
    image: redis:7-alpine
    container_name: deepusecode-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --bind
      - "0.0.0.0"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  # ---------------- 应用（前端 dist 已在 jar 里）----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepusecode:${APP_IMAGE_TAG:-latest}
    container_name: deepusecode-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # .env 里的值原样注入；下面 environment 只覆盖容器内需要改地址的那几项
    env_file:
      - .env
    environment:
      # 容器里数据库和 Redis 走服务名，不是 127.0.0.1
      DB_URL: jdbc:mysql://mysql:3306/testlogin?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      DB_USERNAME: deepusecode
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      LOG_FILE: logs/deepusecode.log
      TZ: Asia/Shanghai
      # 2 核 2G 的机器把这里换成 -Xms256m -Xmx768m
      JAVA_TOOL_OPTIONS: >-
        -Xms512m -Xmx1536m
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/app/logs
    volumes:
      # 日志落到宿主机，方便 tail -f；权限问题见 deploy/DEPLOY-DOCKER.md §6
      - ./logs:/app/logs
    expose:
      - "8081"
    # 想在宿主机直接 curl 后端时取消注释（只绑回环，外网依然碰不到）
    # ports:
    #   - "127.0.0.1:8081:8081"
    networks: [backend]

  # ---------------- Nginx ----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: deepusecode-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # 配好证书、把 nginx.conf 里的 443 段取消注释后再打开这行
      # - "443:443"
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/docker/certs:/etc/nginx/certs:ro
    environment:
      TZ: Asia/Shanghai
    networks: [backend]

volumes:
  mysql-data:
  redis-data:

networks:
  backend:
    driver: bridge
