# 集成测试专用：内存 H2（MySQL 兼容模式），不依赖本地 MySQL。
# 生产配置见 src/main/resources/application.properties。
spring.datasource.url=jdbc:h2:mem:deepusecode_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-for-integration-tests-must-be-long-enough-2026

# 留空 => DeepSeek 客户端走结构化 mock，整条链路仍可验证
deepseek.api.key=

logging.level.org.example.deepusecode=INFO
logging.level.org.springframework.web=WARN

# 测试日志单独落盘，避免污染生产用的 logs/deepusecode.log
logging.file.name=target/test-run.log

