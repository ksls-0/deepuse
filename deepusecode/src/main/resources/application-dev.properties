# ============ 演示用 dev profile ============
# 作用：不依赖本机 MySQL，直接用 H2 文件库跑起来（数据落在 deepusecode/.data 下，重启不丢）。
#
# 启动方式：
#   java -jar target/deepusecode-0.0.1-SNAPSHOT.jar --spring.profiles.active=dev
#
# 想切回真实 MySQL：去掉 --spring.profiles.active=dev，并改好
# application.properties 里的 spring.datasource.username / password。

spring.datasource.url=jdbc:h2:file:./.data/deepusecode;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5

# 文件库用 update，重启后数据仍在；想彻底重置就删掉 deepusecode/.data 目录
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 演示模式关闭 Flyway：V1 里是 MySQL 语法（ENGINE/COLLATE），
# 这里改由 Hibernate 直接建表。真正的 schema 事实来源是 db/migration。
spring.flyway.enabled=false

# dev 环境下把 SQL 日志调安静一点
logging.level.org.hibernate.SQL=WARN
