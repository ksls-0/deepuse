# ===== 服务 =====
server.port=8081
spring.application.name=deepusecode

# ===== 数据源（单库，统一 testlogin）=====
# 凭据一律走环境变量，不要提交到仓库。
# 本地启动（PowerShell）：
#   $env:DB_USERNAME="root"; $env:DB_PASSWORD="你的密码"
# 服务器上用 systemd EnvironmentFile / 容器 Secret 注入。
# DB_URL 也外置，方便部署时改主机与端口。createDatabaseIfNotExist=true：库不存在时自动建库。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/testlogin?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ===== JPA =====
# schema 由 Flyway 管理（见下方 Flyway 段），Hibernate 只做校验不做变更。
# 用 validate 而不是 none：启动时就能发现实体与表结构的漂移。
# 注意：validate 只校验表/列/类型，不校验索引和唯一约束。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# ===== Flyway（数据库迁移）=====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# 已有库（表是早期 ddl-auto 建的、没有 flyway 历史表）首次启动时：
# 把 V1 记为"已应用"而不是去执行它，从而平滑接管旧库。
# 全新空库不会触发 baseline，会正常执行 V1 建表。
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=baseline from hibernate-managed schema
# 迁移脚本里有唯一索引，校验和要稳定，不要在这里放开乱七八糟的选项
spring.flyway.validate-on-migrate=true

# ===== Redis（验证码存储与限流）=====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s

# ===== JWT =====
# 刻意不给默认值：写死默认密钥等于所有人都能伪造 token，缺失时应用直接启动失败。
# 启动前请设置环境变量 JWT_SECRET（>=32 字符），例如 openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# ===== DeepSeek =====
deepseek.api.base-url=https://api.deepseek.com
deepseek.api.chat-model=deepseek-chat
deepseek.api.timeout-ms=120000
deepseek.api.max-tokens=2500
# 生成角色卡（人设创作需要更高的采样温度）
deepseek.api.creative-temperature=1.3
# 日常对话
deepseek.api.chat-temperature=1.0
# 未配置 key 时后端自动降级为结构化 mock，流程依然可跑通
deepseek.api.key=${DEEPSEEK_API_KEY:}

# ===== AI 配额 =====
# 每个用户 24 小时内最多生成多少次角色模板。<= 0 表示不限量（本地压测用）。
# 不设上限的话，单个用户狂点「生成」就能把 DeepSeek 账单刷爆。
app.ai.daily-generation-limit=${AI_DAILY_GENERATION_LIMIT:20}
# ===== 管理员 =====
# 逗号分隔的账号白名单（邮箱或手机号）。白名单里的账号注册即成为管理员；
# 已存在的账号在应用启动时被提升。角色写在 JWT claim 里，改角色后需重新登录。
app.admin.accounts=${APP_ADMIN_ACCOUNTS:}

# ===== CORS =====
# 同源部署（前端 dist 打进本 jar）时 CORS 不参与，留默认即可。
# 前后端分域部署时通过环境变量覆盖为前端域名。
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082,http://localhost:5173,http://localhost:3000}

# ===== 运维端点（Actuator）=====
# 只暴露健康检查，不暴露 env/beans/heapdump 等敏感端点
management.endpoints.web.exposure.include=health,info
# 不向外泄漏数据库连接、磁盘路径等内部细节
management.endpoint.health.show-details=never
# 提供 /actuator/health/liveness 与 /actuator/health/readiness 供容器探针使用
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=deepusecode
info.app.description=角色工坊 - 题集与 AI 角色模板平台

# ===== 日志 =====
logging.level.org.example.deepusecode=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
# 落盘 + 滚动，避免重启即丢、避免刷爆磁盘
logging.file.name=${LOG_FILE:logs/deepusecode.log}
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n
