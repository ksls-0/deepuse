  <text x="72" y="1186" font-size="13" fill="#22d3ee" letter-spacing="4"
        font-family="'Cascadia Mono',Consolas,monospace">WHY US</text>
  <text x="72" y="1224" font-size="30" font-weight="700" fill="#ffffff">为什么选择我们</text>

  <g font-size="20">
    <text x="72" y="1282" font-size="17" fill="#22d3ee" font-family="'Cascadia Mono',Consolas,monospace">01</text>
    <text x="130" y="1282" font-weight="700" fill="#ffffff">问答即资产</text>
    <text x="252" y="1282" fill="#95b3cd">一次采集，反复生成，知识留在自己手里</text>
    <line x1="72" y1="1304" x2="1008" y2="1304" stroke="#17395c" stroke-width="1"/>

