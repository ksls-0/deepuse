    <rect x="72" y="64" width="64" height="64" rx="16" fill="#0a2036" stroke="url(#cardEdge)" stroke-width="2"/>
    <g stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M92 96 L104 84 L116 100"/>
      <path d="M104 84 L116 100" stroke-opacity="0.5"/>
