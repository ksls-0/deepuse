    <text x="154" y="98" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="1">角色工坊</text>
    <text x="356" y="96" font-size="24" font-weight="600" fill="#22d3ee" letter-spacing="3">RoleForge</text>
