  <!-- 卡片 1 -->
  <g>
    <rect x="72" y="580" width="456" height="252" rx="18" fill="url(#card)" stroke="url(#cardEdge)" stroke-width="1.6"/>
    <g stroke="#22d3ee" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(100,612)">
