    <line x1="72" y1="1436" x2="1008" y2="1436" stroke="#17395c" stroke-width="1"/>

    <text x="72" y="1480" font-size="17" fill="#22d3ee" font-family="'Cascadia Mono',Consolas,monospace">04</text>
    <text x="130" y="1480" font-weight="700" fill="#ffffff">数据即私有</text>
    <text x="252" y="1480" fill="#95b3cd">JWT 无状态鉴权，密钥全部外置，敏感配置不进仓库</text>
  </g>
  <line x1="72" y1="1502" x2="1008" y2="1502" stroke="#1d4269" stroke-width="1"/>

