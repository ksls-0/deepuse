  <text x="72" y="286" font-size="66" font-weight="700" fill="url(#heroText)" letter-spacing="1.5">打破经验孤岛</text>
  <text x="72" y="366" font-size="66" font-weight="700" fill="url(#heroText)" letter-spacing="1.5">一键生成可对话角色</text>

  <rect x="72" y="392" width="5" height="26" rx="2.5" fill="#22d3ee"/>
  <text x="92" y="413" font-size="20" fill="#9fc0dc">一份问答 → 一张结构化角色卡 → 一段可持续的对话</text>
