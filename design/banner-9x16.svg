    <circle cx="250" cy="430" r="2.6"/><circle cx="110" cy="400" r="2.6"/>
    <circle cx="820" cy="210" r="3.5"/><circle cx="950" cy="150" r="2.6"/><circle cx="1040" cy="260" r="3.5"/>
    <circle cx="980" cy="380" r="2.6"/><circle cx="860" cy="340" r="2.6"/>
    <circle cx="880" cy="520" r="2.6"/><circle cx="1000" cy="470" r="3.5"/><circle cx="1040" cy="590" r="2.6"/>
    <circle cx="40" cy="1180" r="2.6"/><circle cx="170" cy="1120" r="3.5"/><circle cx="300" cy="1210" r="2.6"/>
    <circle cx="760" cy="1500" r="2.6"/><circle cx="890" cy="1440" r="3.5"/><circle cx="1010" cy="1520" r="2.6"/><circle cx="960" cy="1640" r="2.6"/>
    <circle cx="120" cy="1700" r="2.6"/><circle cx="240" cy="1650" r="3.5"/><circle cx="360" cy="1730" r="2.6"/>
