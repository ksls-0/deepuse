<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC','Source Han Sans SC',sans-serif">

  <defs>
    <!-- 背景渐变：深蓝黑 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#050c18"/>
      <stop offset="0.45" stop-color="#08152a"/>
      <stop offset="1" stop-color="#040910"/>
    </linearGradient>

    <!-- 青色光晕 -->
    <radialGradient id="glowTop" cx="0.12" cy="0.06" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0.9" cy="0.92" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <!-- 网格 -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1b3f66" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="gridBig" width="180" height="180" patternUnits="userSpaceOnUse">
      <path d="M180 0H0V180" fill="none" stroke="#2a5f8f" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>

    <!-- 卡片渐变 -->
    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0d2440" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#081827" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.75"/>
    </linearGradient>

    <!-- 发光 -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- 顶部标题渐变字 -->
    <linearGradient id="heroText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#e6fbff"/>
      <stop offset="1" stop-color="#5ee9ff"/>
    </linearGradient>
  </defs>

  <!-- ================= 背景 ================= -->
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grid)"/>
  <rect width="1080" height="1920" fill="url(#gridBig)"/>
  <rect width="1080" height="1920" fill="url(#glowTop)"/>
  <rect width="1080" height="1920" fill="url(#glowBottom)"/>

  <!-- 拓扑连线（背景装饰） -->
  <g stroke="#22d3ee" stroke-opacity="0.20" fill="none" stroke-width="1.2">
    <path d="M60 300 L190 240 L320 320 L250 430 L110 400 Z"/>
    <path d="M820 210 L950 150 L1040 260 L980 380 L860 340 Z"/>
    <path d="M880 520 L1000 470 L1040 590"/>
    <path d="M40 1180 L170 1120 L300 1210"/>
    <path d="M760 1500 L890 1440 L1010 1520 L960 1640"/>
    <path d="M120 1700 L240 1650 L360 1730"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.42">
