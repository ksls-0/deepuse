# ============================================================
# Nginx 配置（单体部署：同一个 jar 托管前端 dist + API）
#
# 关键点：
#   1. SSE 必须关 proxy_buffering / gzip，否则流式变一次性吐出
#   2. proxy_read_timeout 必须大于后端最慢的同步接口，见下方 server 级配置
#   3. 只用一层 proxy_pass 到 127.0.0.1:8081，SPA 深链由后端回退到 index.html
#
# 放到 /etc/nginx/conf.d/deepusecode.conf，改掉 your-domain.com 与证书路径。
# ============================================================

server {
    listen 80;
    server_name your-domain.com;
    # 强制跳 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 安全响应头（后端也会给一部分，这里补齐容易被代理丢掉的）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    # ---------------- 超时：必须放在 server 级 ----------------
    # 默认 proxy_read_timeout 是 60s，而下面两个同步接口会一直等到 AI 返回：
    #   POST /api/sets/{id}/generate        同步生成角色（后端 deepseek.api.timeout-ms=120000）
    #   POST /api/conversations/{id}/chat   同步对话（同上）
    # 生成一张角色卡 60~90s 很常见，用默认值会被 Nginx 提前掐断返回 504，
    # 但后端其实已经生成成功、额度也已经扣掉 —— 用户重试，白烧额度还看不到结果。
    # 取 180s：大于后端 120s 的 AI 超时，留出建连与回写余量。
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # ---------------- SSE 流式对话：必须单独处理 ----------------
    location ~ ^/api/conversations/[0-9]+/chat/stream$ {
        proxy_pass http://127.0.0.1:8081;

        # 这三行是 SSE 能不能流式输出的关键
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_http_version 1.1;
        proxy_set_header Connection '';          # 清掉 keep-alive 头，保证 chunked 直通
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端 SseEmitter 超时 180s，这里给到 300s 留余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 其余请求 ----------------
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端 LoginAttemptService 读这个头做登录限流，必须透传真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源由后端直接输出，交给浏览器缓存
        proxy_buffering on;
    }

    # 健康检查不写访问日志，避免探针刷爆日志
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8081;
        access_log off;
    }
}
