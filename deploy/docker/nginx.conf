# ============================================================
# Nginx 容器内配置（反代到同一 compose 网络里的 app 服务）
#
# 与 deploy/nginx.conf 的区别只有两处：
#   1. upstream 是 `app:8081`（容器服务名，不是 127.0.0.1）
#   2. 默认只开 80；证书准备好后取消 443 段的注释
#
# 挂载位置：/etc/nginx/conf.d/default.conf
# ============================================================

server {
    listen 80;
    server_name _;

    # ---------- 演示阶段（还没配证书 / 还没备案完）就用这段 ----------

    client_max_body_size 10m;

    # ---------------- 超时：必须放在 server 级 ----------------
    # Nginx 默认 proxy_read_timeout 只有 60s，而下面两个同步接口要一直等到 AI 返回：
    #   POST /api/sets/{id}/generate        同步生成角色（后端 deepseek.api.timeout-ms=120000）
    #   POST /api/conversations/{id}/chat   同步对话（同上）
    # 实测角色卡约 10~15 秒（deepseek-chat），问答很长或上游抖动时会明显更久，
    # 一旦超过默认的 60s 就会先被 Nginx 掐断返回 504，
    # 但后端其实已经生成成功、额度也已经扣掉 —— 用户重试，白烧额度还看不到结果。
    proxy_connect_timeout 10s;
    proxy_send_timeout    180s;
    proxy_read_timeout    180s;

    # ---------------- SSE 流式对话 ----------------
    location ~ ^/api/conversations/[0-9]+/chat/stream$ {
        proxy_pass http://app:8081;

        # 这三行是 SSE 能不能流式输出的关键
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端 SseEmitter 超时 180s，这里给到 300s 留余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------------- 其余请求 ----------------
    location / {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端 LoginAttemptService 读这个头做登录限流，必须透传真实 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
    }

    # 健康检查不写访问日志，避免探针刷爆日志
    location = /actuator/health {
        proxy_pass http://app:8081;
        access_log off;
    }
}

